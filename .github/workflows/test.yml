name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the runtime in the Dockerfile (node:20-alpine).
          node-version: 20
          cache: npm

      # better-sqlite3 is a native module and the migration tests need it built.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
